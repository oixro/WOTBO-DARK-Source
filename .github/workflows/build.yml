name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  release-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild Project.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
